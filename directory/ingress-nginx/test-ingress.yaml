apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-ingress
  annotations:
    nginx-trial: "true"  # This annotation filters the ingresses that nginx-ingress will manage
spec:
  rules:
    - host: "test.local"  # This should match the domain you want to test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infra-nginx-ingress-trial-ingress-nginx-controller  # The name of your service
                port:
                  number: 32199  # The NodePort you are using

